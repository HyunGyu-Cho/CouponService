name: checks

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build-test:
    name: 빌드와 테스트
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:12
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: coupon_service
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:mariadb://localhost:3307/coupon_service
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew test

  docs:
    name: 문서 링크
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-links.sh

  commits:
    name: 커밋 메시지와 문서 판단
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: 검사 범위의 커밋을 하나씩 확인
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="${{ github.sha }}~1..${{ github.sha }}"
          fi
          # 검사 장치 도입 이전 커밋은 소급하지 않는다
          since="583402d0172e7c3d81c206b9e699143af53e9f43"
          failed=0
          for sha in $(git rev-list --no-merges --reverse "$range"); do
            git merge-base --is-ancestor "$sha" "$since" 2>/dev/null && continue
            bash scripts/check-commit.sh --commit "$sha" || failed=1
          done
          exit $failed

  stage:
    name: 단계 완료 조건 (태그)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    services:
      mariadb:
        image: mariadb:12
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: coupon_service
        ports: ["3307:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_URL: jdbc:mariadb://localhost:3307/coupon_service
      DB_USERNAME: root
      DB_PASSWORD: root
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: 태그 이름에서 단계 추출 (v3-atomic-update -> v3)
        run: |
          chmod +x gradlew
          stage="$(echo "${GITHUB_REF_NAME}" | sed -E 's/^(v[0-9]+).*/\1/')"
          bash scripts/check-stage.sh "$stage"
