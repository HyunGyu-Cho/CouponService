spring.config.import=optional:file:./.env[.properties]

spring.application.name=CouponService

# Coupon issue version
coupon.issue.version=v4

# Logging
logging.charset.console=UTF-8

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# MariaDB
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/coupon_service}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
# 기본값은 HikariCP 기본과 같은 10이다. 부하 실험에서 풀 크기를 바꿔볼 때만 환경변수로 덮는다.
# 값을 파일에 직접 박으면 테스트에도 적용돼, 테스트 컨텍스트 여러 개가 각자 풀을 만들면서
# MariaDB max_connections(기본 151)를 넘겨 "Too many connections"로 컨텍스트 로딩이 실패한다.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# Flyway / Batch
spring.flyway.enabled=true
spring.batch.job.enabled=false

# Actuator
# V4부터 Redis가 발급 경로에 있으므로 health 확인을 되돌린다
management.health.redis.enabled=true
# 부하 실험에서 HikariCP 커넥션 풀 지표를 읽기 위해 metrics 를 노출한다 (load-tests/snapshot.ps1)
management.endpoints.web.exposure.include=health,metrics