spring.config.import=optional:file:./.env[.properties]

spring.application.name=CouponService

# Coupon issue version
coupon.issue.version=v3

# Logging
logging.charset.console=UTF-8

# MariaDB
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/coupon_service}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# Flyway / Batch
spring.flyway.enabled=true
spring.batch.job.enabled=false

# Actuator
management.health.redis.enabled=false
# 부하 실험에서 HikariCP 커넥션 풀 지표를 읽기 위해 metrics 를 노출한다 (load-tests/snapshot.ps1)
management.endpoints.web.exposure.include=health,metrics